# The task board with PostgreSQL for the tasks and RustFS (S3-compatible storage) for their files.
# Values come from the environment or a .env file next to this one (see .env.example). To run only
# the database and storage, e.g. for the app started with `streamlit run`: `docker compose up -d db rustfs`.
services:
  app:
    image: ghcr.io/ptylczynski/another-task-board:latest
    # `docker compose up --build` builds the image from this checkout instead of pulling it.
    build: .
    restart: unless-stopped
    environment:
      # The other services, by their names on the compose network.
      TASKBOARD_DB_HOST: db
      TASKBOARD_DB_PORT: 5432
      TASKBOARD_DB_NAME: ${TASKBOARD_DB_NAME:-taskboard}
      TASKBOARD_DB_USER: ${TASKBOARD_DB_USER:-taskboard}
      TASKBOARD_DB_PASSWORD: ${TASKBOARD_DB_PASSWORD}
      TASKBOARD_S3_ENDPOINT_URL: http://rustfs:9000
      TASKBOARD_S3_BUCKET: ${TASKBOARD_S3_BUCKET:-taskboard}
      TASKBOARD_S3_ACCESS_KEY: ${TASKBOARD_S3_ACCESS_KEY:-taskboard}
      TASKBOARD_S3_SECRET_KEY: ${TASKBOARD_S3_SECRET_KEY}
      TASKBOARD_S3_REGION: ${TASKBOARD_S3_REGION:-}
      # Unset ones are passed as empty, which the app treats as unset.
      TASKBOARD_LOGIN: ${TASKBOARD_LOGIN:-}
      TASKBOARD_PASSWORD: ${TASKBOARD_PASSWORD:-}
      TASKBOARD_OIDC_CLIENT_ID: ${TASKBOARD_OIDC_CLIENT_ID:-}
      TASKBOARD_OIDC_CLIENT_SECRET: ${TASKBOARD_OIDC_CLIENT_SECRET:-}
      TASKBOARD_OIDC_SERVER_METADATA_URL: ${TASKBOARD_OIDC_SERVER_METADATA_URL:-}
      TASKBOARD_OIDC_REDIRECT_URI: ${TASKBOARD_OIDC_REDIRECT_URI:-}
      TASKBOARD_OIDC_COOKIE_SECRET: ${TASKBOARD_OIDC_COOKIE_SECRET:-}
      TASKBOARD_AUTH_DISABLED: ${TASKBOARD_AUTH_DISABLED:-}
    ports:
      # Only reachable from this machine; put a reverse proxy in front to serve it to others.
      - "127.0.0.1:${TASKBOARD_PORT:-8501}:8501"
    depends_on:
      db:
        condition: service_healthy
      rustfs:
        condition: service_healthy


  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${TASKBOARD_DB_NAME:-taskboard}
      POSTGRES_USER: ${TASKBOARD_DB_USER:-taskboard}
      POSTGRES_PASSWORD: ${TASKBOARD_DB_PASSWORD:?Set TASKBOARD_DB_PASSWORD (see .env.example)}
    ports:
      # Only reachable from this machine.
      - "127.0.0.1:${TASKBOARD_DB_PORT:-5432}:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 3s
      retries: 10

  rustfs:
    image: rustfs/rustfs:1.0.1
    restart: unless-stopped
    environment:
      RUSTFS_ACCESS_KEY: ${TASKBOARD_S3_ACCESS_KEY:-taskboard}
      RUSTFS_SECRET_KEY: ${TASKBOARD_S3_SECRET_KEY:?Set TASKBOARD_S3_SECRET_KEY (see .env.example)}
      RUSTFS_CONSOLE_ENABLE: "true"
      # Log to stdout, so `docker compose logs` shows them.
      RUSTFS_OBS_LOG_DIRECTORY: ""
    ports:
      # S3 API and web console, only reachable from this machine.
      - "127.0.0.1:${TASKBOARD_S3_PORT:-9000}:9000"
      - "127.0.0.1:${TASKBOARD_S3_CONSOLE_PORT:-9001}:9001"
    volumes:
      - rustfs-data:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:9000/health"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  db-data:
  rustfs-data:
